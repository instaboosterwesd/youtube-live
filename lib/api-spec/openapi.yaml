openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: streaming
    description: Live stream control operations
  - name: media
    description: Local media upload operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stream/start:
    post:
      operationId: startStream
      tags: [streaming]
      summary: Start a live stream
      description: Starts FFmpeg and sends a selected local category video to the supplied ingest URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamStartInput"
      responses:
        "202":
          description: Stream process accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamControlResponse"
        "400":
          description: Invalid stream configuration
        "409":
          description: Stream is already running
        "500":
          description: Stream process could not start
  /stream/stop:
    post:
      operationId: stopStream
      tags: [streaming]
      summary: Stop a live stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamStopInput"
      responses:
        "200":
          description: Stream stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamControlResponse"
        "404":
          description: Stream is not running
  /stream/status/{streamId}:
    get:
      operationId: getStreamStatus
      tags: [streaming]
      summary: Get stream process status
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamControlResponse"
  /media/upload:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload a local video for server-side streaming
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          video/*:
            schema:
              type: string
              format: binary
      parameters:
        - name: X-File-Name
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "201":
          description: Media is ready for streaming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "400":
          description: Invalid media upload
  /media/files/{fileId}:
    get:
      operationId: getMediaFile
      tags: [media]
      summary: Serve an uploaded local media file
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Media file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Media file not found
  /media/youtube-download:
    post:
      operationId: downloadYoutubeVideo
      tags: [media]
      summary: Download a YouTube video at the best available quality
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YoutubeDownloadInput"
      responses:
        "201":
          description: YouTube video downloaded and ready for streaming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeDownloadResponse"
        "400":
          description: Invalid URL or download failure
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StreamStartInput:
      type: object
      properties:
        streamId:
          type: string
          minLength: 1
        ingestUrl:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        videoSource:
          type: string
        faceCategory:
          type: string
        faceSource:
          type: string
        aspectRatio:
          type: string
          enum: [shorts, full, square]
          default: full
        facePosition:
          type: string
          enum: [top-left, top-right, bottom-left, bottom-right, center]
          default: bottom-right
        faceScale:
          type: number
          minimum: 0.1
          maximum: 0.6
          default: 0.25
        durationMinutes:
          type: number
          minimum: 1
          maximum: 1440
        autoRestart:
          type: boolean
          default: false
      required:
        - streamId
        - ingestUrl
        - category
    StreamStopInput:
      type: object
      properties:
        streamId:
          type: string
          minLength: 1
      required:
        - streamId
    StreamControlResponse:
      type: object
      properties:
        streamId:
          type: string
        status:
          type: string
          enum: [running, stopped, failed]
        message:
          type: string
        pid:
          type: ["number", "null"]
      required:
        - streamId
        - status
        - message
        - pid
    MediaUploadResponse:
      type: object
      properties:
        fileId:
          type: string
        filename:
          type: string
        sourcePath:
          type: string
        playbackUrl:
          type: string
      required:
        - fileId
        - filename
        - sourcePath
        - playbackUrl
    YoutubeDownloadInput:
      type: object
      properties:
        url:
          type: string
          minLength: 1
      required:
        - url
    YoutubeDownloadResponse:
      type: object
      properties:
        fileId:
          type: string
        filename:
          type: string
        sourcePath:
          type: string
        playbackUrl:
          type: string
        title:
          type: string
        duration:
          type: string
      required:
        - fileId
        - filename
        - sourcePath
        - playbackUrl
        - title
        - duration

